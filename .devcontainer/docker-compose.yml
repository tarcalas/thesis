services:
  dev:
    image: thesis_devcontainer-dev
    command: sleep infinity
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/thesis
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/secretgraph
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: